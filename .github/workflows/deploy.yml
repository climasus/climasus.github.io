name: Deploy Portal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch i18n from design-system
        run: |
          mkdir -p assets/i18n
          for lang in pt en es; do
            curl -fsSL \
              "https://climasus.github.io/design-system/data/i18n/${lang}.json" \
              -o "assets/i18n/${lang}.json" || exit 1
          done

      - name: Fetch data and assets from design-system
        run: |
          mkdir -p assets/data/team assets/data/project assets/icons

          # Team
          curl -fsSL \
            "https://climasus.github.io/design-system/data/team/members.json" \
            -o "assets/data/team/members.json" || exit 1

          # Project data
          for file in repositories architecture roadmap organization; do
            curl -fsSL \
              "https://climasus.github.io/design-system/data/project/${file}.json" \
              -o "assets/data/project/${file}.json" || exit 1
          done

          # Favicon
          curl -fsSL \
            "https://climasus.github.io/design-system/assets/icons/favicon-16x16.png" \
            -o "assets/icons/favicon-16x16.png" || true

          # Logo
          mkdir -p assets/logos
          curl -fsSL \
            "https://climasus.github.io/design-system/assets/logos/climasuslogo.png" \
            -o "assets/logos/climasuslogo.png" || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.github,*.md'
